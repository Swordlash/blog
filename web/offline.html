<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- The same Content Security Policy as index.html's, which a test
         keeps equal (wiki-app's Test.Policy). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https://api.anthropic.com https://api.openai.com; img-src 'self' https: data: blob:; media-src 'self' https: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline - Wiki</title>
    <!-- The wiki's offline page: what its service worker (web/src/sw.js)
         shows, offline, for an address it has no copy of, with its base and
         the list of the pages it has copies of filled in. -->
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="app">
      <div class="wiki wiki-offline">
        <header class="wiki-header">
          <a class="wiki-brand" href="./">Wiki</a>
        </header>
        <div class="wiki-body">
          <main class="wiki-content">
            <section class="offline-page">
              <h1>This page is not available offline</h1>
              <p>You are offline, and this page has not been read on this device, so there is no copy of it here. It will be there once the connection is back.</p>
              <h2>Pages you can read offline</h2>
              <ul class="offline-pages">
        <!-- wiki-offline-pages -->
              </ul>
            </section>
          </main>
        </div>
        <p class="offline-notice" role="alert">You are offline: the wiki cannot be reached until the connection is back.</p>
      </div>
    </div>
  </body>
</html>
