# Delete a cabal store from GitHub's cache (decision 54 of docs/PLAN.md), by
# hand, from the Actions tab, every cabal version's: when a store has grown too large with old
# versions of libraries or of compilers, or when it is suspected of holding
# something broken. Every copy of it goes, on every branch; the next run of
# build.yml's native job (for "native") or wasm job (for "wasm") builds it
# again from nothing and saves it. "wasm" deletes server-page.yml's -O2
# store too (Linux-wasm-opt-store-...), which starts again from the wasm
# job's.
name: Delete a cabal store

on:
  workflow_dispatch:
    inputs:
      store:
        description: "Which store: native (the native job's, with GHC's floor), wasm (the wasm job's and server-page.yml's -O2 one) or both"
        type: choice
        options:
          - native
          - wasm
          - both
        required: true

permissions:
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
    - name: Delete every copy of the store
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        STORE: ${{ inputs.store }}
      run: |
        case $STORE in
          both) kinds="native wasm" ;;
          *) kinds=$STORE ;;
        esac
        # Linux-native- and Linux-wasm- take the store under its key and under
        # the older keys build.yml and server-page.yml still restore as a
        # fallback (Linux-native-ghc-..., Linux-wasm-<compiler>-...,
        # Linux-wasm-opt-...), which would otherwise bring the store back. No
        # other cache starts with them: the build directories, apt archives
        # and ghcup caches start with Linux-X64-, Linux-ghcup- or
        # Linux-ghc-wasm-.
        for kind in $kinds; do
          prefix="Linux-$kind-"
          ids=$(gh cache list --key "$prefix" --limit 1000 --json id,key --jq '.[] | "\(.id) \(.key)"')
          if [ -z "$ids" ]; then
            echo "No copy of $prefix* is cached."
            continue
          fi
          printf '%s\n' "$ids" | while read -r id key; do
            echo "Deleting $key"
            gh cache delete "$id"
          done
        done
