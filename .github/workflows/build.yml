name: CI

# Markdown alone (the plan, the README, notes) builds nothing, so a change
# to it alone runs no CI. Some Markdown is compiled into the programs and
# counts as code here: wiki-core's built-in templates (wiki-core/templates) and
# its Markdown reference (wiki-core/reference/markdown.md, a symbolic link
# to docs/markdown.md, which is the file a change to the reference
# touches), and the changelog's entries (changelog/), which wiki-server
# embeds for its page "What's new?" and the changelog job checks. The
# filter is `paths` with `!` rather than `paths-ignore`: GitHub documents
# `!` for `paths` only, where a later pattern takes a path back.
# server-page.yml and toolchain/deploy-local.sh's is_code say the same of
# what the page is built from, which the changelog is not part of: they
# leave changelog/ out.
#
# A pull request runs CI whatever its base branch: `pull_request` names no
# branch. Pull requests that are open together and touch common files are
# stacked (AGENTS.md): each is based on the branch of the one before, and
# its run tests it merged into that branch. When the lower one merges,
# GitHub deletes its branch and retargets the upper one to main. That
# starts no run: a change of base is the type `edited`, which is left out
# so that editing a title or a description does not build everything
# again. After a merge commit, the upper one keeps the checks of its head,
# which were run on top of the lower branch, whose content is then main's;
# the owner merges it without waiting. The tree those checks tested is the
# merged tree only if main took nothing else in between. The push to main
# of the upper one's merge is then not counted as tested
# (toolchain/ci-already-tested.sh says why), so the full CI runs on main
# for it. After a squash or a rebase, the session rebases the upper one
# onto main (AGENTS.md), and its new head gets a run as any pull request's.
on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - 'changelog/**'
      - 'wiki-core/templates/**'
      - 'wiki-core/reference/**'
      - 'docs/markdown.md'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - 'changelog/**'
      - 'wiki-core/templates/**'
      - 'wiki-core/reference/**'
      - 'docs/markdown.md'
  workflow_dispatch:
    inputs:
      # Which runner wasm takes on a run by hand: the owner's (the default)
      # when it is free, as for a push, or GitHub's hosted ones whatever the owner's
      # machine is doing, to exercise the hosted path, or to get a run going
      # while the machine is off.
      runner:
        description: "Where to run wasm: self-hosted (the owner's machine, when it is free) or hosted (ubuntu-latest)"
        type: choice
        options:
          - self-hosted
          - hosted
        default: self-hosted
  # Once a week, on the hosted runners whatever the owner's machine is doing
  # (plan sends a scheduled run there): GitHub evicts a cache nobody has
  # read for seven days, and the hosted wasm caches on main (the cabal store,
  # the wasm toolchain, Chromium) are read only when wasm goes hosted, a
  # fork's or a bot's pull request or a busy week. A push to main usually
  # takes the owner's machine, where nothing is saved to GitHub, so this run
  # is what saves main's hosted wasm copies. The run reads them, and saves
  # them again, so a pull request that lands on the hosted runners never
  # starts from an empty store (the wasm store takes three quarters of an
  # hour to build there). A pull request can restore only its own caches,
  # its base branch's and main's, and a base branch other than main has
  # none (no run is made for a push to it): a stacked pull request finds
  # its own and main's, as any other does, and not the lower one's.
  schedule:
    - cron: '17 3 * * 1'

# A new push to a branch (or to a pull request's branch) cancels the run still
# going for the previous one: only the newest commit's result matters. The
# branch is named with its repository, so that a fork's pull request from a
# branch named like one of ours neither cancels our run nor is cancelled by
# it. A run by hand, and the weekly run, have a group of their own, their
# run's id: they name the same ref as a push to main (refs/heads/main), and
# in a shared group a fast-forward of main cancelled a run by hand still
# going (one on the hosted runners, say) and a run by hand cancelled the
# push's.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.run_id || format('{0}-{1}', github.event.pull_request.head.repo.full_name || github.repository, github.head_ref || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

# Only wasm may use the owner's runner. native, format and deploy always
# run on ubuntu-latest; the native groups, wasm and format run in parallel after plan.
# The first job, `plan`, runs on GitHub's hosted runners for every run
# (seconds, and free on a public repository) and hands its runner choice
# only to wasm's `runs-on`. It goes by trust first, by one expression
# (`plan`'s TRUSTED). The
# self-hosted runner registered for this repository is the owner's machine,
# and a job there runs whatever the checked-out tree builds (Template
# Haskell, cabal's dependencies, npm's scripts) as the runner's user. So it
# takes only what someone with write access put in this repository: a push
# to main, a run by hand, a pull request whose head branch is in this
# repository (only write access pushes one: the owner, and the Claude
# sessions acting for them). A pull request from a fork, whose code anyone
# may have written, and anything a bot started (Dependabot's branches are in
# this repository, so the head alone would not tell), run on GitHub's hosted
# runners instead, which start empty and are thrown away; so does a run by
# hand with the input `runner: hosted`. A fork's pull request is compared
# by the head's repository rather than by its `fork` flag, so that a head
# whose repository has been deleted (null) goes to the hosted runners too.
# A trusted run then takes the owner's machine only if it is free:
# toolchain/ci-pick-runner.sh asks the Actions API, with the run's own
# token, whether another run of this workflow has a job queued or running
# there, and sends this run to the hosted runners if one has (GitHub has
# no "whichever is free" of its own: `runs-on` with several labels asks for
# a runner that carries them all). Whether the machine is on, the token
# cannot see, so a run sent to it while it is off waits until it is back
# (or is cancelled, and run by hand with `runner: hosted`).
# The owner can also send every push's and pull request's wasm job to the
# hosted runners without a commit, by setting the repository variable
# WASM_RUNNER to `hosted` (Settings, Secrets and variables, Actions,
# Variables, or `gh variable set WASM_RUNNER --body hosted`): for the times
# when Claude sessions build on the owner's machine and slow the wasm job
# down there. Unset, empty or any other value changes nothing. A run by
# hand follows its own input `runner` instead, and the weekly run is hosted
# anyway. The variable is not part of the trust rule and cannot loosen it:
# it can only send a run to the hosted runners, never to the owner's
# machine.
# A fork's run also waits for the owner's approval first: the repository's
# setting, Settings, Actions, General, "Fork pull request workflows from
# outside collaborators", requires it for every outside contributor. That
# approval is the guard that holds when the trust rule does not: a pull
# request's run takes this file and the script from the pull request's own
# tree, so a fork could change either, and approving a fork's run means
# reading what it changes here and in toolchain/ci-pick-runner.sh first.
# No job uses a secret but the run's own token. It may only read, except
# in prune-caches, which may also delete the repository's Actions caches
# (`actions: write`), to prune the older copies of the caches native and
# wasm save (toolchain/ci-prune-caches.sh). See the README's CI section.
#
# The two kinds of runner get the toolchain differently, and every step that
# differs says which it is for with `runner.environment`. A hosted runner
# starts empty each time, so it takes GHC and cabal from haskell-actions/setup,
# Node from setup-node and the rest from caches, as haskell-halogen's workflow
# does. A self-hosted runner keeps its home directory, so it installs the
# toolchain there with toolchain/bootstrap.sh, as a developer or a cloud session
# does: the first run takes a while and later ones only check it, and nothing
# is cached to GitHub, since the toolchain and cabal store stay on the machine
# anyway. The bootstrap is not used on hosted runners as well because it
# installs everything every job needs (the wasm compiler and Chromium for the
# format job too), and the hosted image keeps ghcup's tools under
# /usr/local/.ghcup beside its own, which are not ours to cache.

# The pins, in one place. toolchain/bootstrap.sh holds the same values (it is
# what a developer or a cloud session installs from); change them together, and
# together with the haskell-halogen commit cabal.project pins, whose own CI
# these follow.
env:
  # The version wiki-server's page "What's new?" shows for the builds of a
  # run (Wiki.Server.WhatsNew): the commit's, the pull request's head for a
  # pull request rather than the merge commit GitHub tests.
  WIKI_BUILD_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
  GHC_VERSION: '9.14.1'
  # The oldest GHC the native build supports (GHC_MIN_VERSION in
  # toolchain/pins.env; decision 53 of docs/PLAN.md), at its newest release:
  # the native job installs its dependencies into the store, and the
  # native-floor job builds the wiki with it.
  GHC_FLOOR_VERSION: '9.10.3'
  CABAL_VERSION: '3.16.1.0'
  # Keep WASM_GHC_VERSION in step with with-compiler in cabal-wasm.project.
  WASM_GHC_VERSION: '9.14.1.20260731'
  GHC_WASM_META_REV: '358ea50b8496a69da6ce375c0c58bc049dbcb92d'
  GHC_WASM_FLAVOUR: '9.14'
  NODE_VERSION: '24'
  FOURMOLU_VERSION: '0.21.0.0'
  # Of the release's fourmolu-<version>-linux-x86_64.zip (since 0.20.0.0 the
  # releases ship zips, one binary inside), checked before it is unpacked.
  # toolchain/bootstrap.sh holds the same value.
  FOURMOLU_SHA256: 'aadf6931653df7b96f52014cf8eb4285a3e8778cd0b531499fc3ee013e1e00c7'

jobs:
  # A pull request's changelog entry (toolchain/check-changelog.sh, the
  # README's "Changelog entries"): it adds exactly one entry under
  # changelog/, well formed, with the pull request's number, and every
  # entry it changes is well formed. A few seconds, on its own: it needs
  # no toolchain and waits for no build. A pull request labelled
  # no-changelog is exempt; the label is the owner's (AGENTS.md). The
  # labels are read when the job runs, so that after adding the label a
  # re-run of this job alone passes: a label does not start a run of this
  # workflow, which would build everything again. Pushes to main have no
  # pull request and no check. The pull request's changes are those from
  # the first parent of the merge commit the run checks out (HEAD^1), which
  # is its base as GitHub merged it: main, or the lower branch of a stack.
  # The base is not named by its branch, origin/<base>: a stacked pull
  # request's base branch is deleted when the lower one merges, and a
  # re-run after that (for the label) would find no such branch.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Check the changelog entry
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        EVENT_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
      run: |
        labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name' 2>/dev/null) || labels=$EVENT_LABELS
        sh toolchain/check-changelog.sh --pr "$PR" --base 'HEAD^1' --labels "$labels"

  # What the run does and where, decided on a hosted runner for every run:
  # whether the build jobs need to run at all (on a push), and which runner
  # wasm takes (see the top).
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
      run_id: ${{ steps.check.outputs.run_id }}
      runner: ${{ steps.pick.outputs.runner }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    # On a push to main, whether a pull request's run has already built and
    # tested this tree and passed: pull requests are rebased and main is
    # fast-forwarded to their head (AGENTS.md), so the push is usually the
    # very commit the pull request's last run tested. The build jobs then
    # skip. Not asked for pull requests or by hand, where they always run.
    # The merge of a stacked pull request other than the lowest is not
    # found, and the full CI runs (see the top and the script).
    # Once the demo is deployed (the repository is public, see the deploy
    # job), the run found must also have kept the page it built, which the
    # deploy job takes from it: a run from before the page was kept, or
    # whose artifact has expired, does not count, and the full CI runs.
    - name: Look for a passing pull request run of this tree
      if: github.event_name == 'push'
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
        REQUIRE_ARTIFACT: ${{ github.event.repository.private == false && 'app' || '' }}
      run: sh toolchain/ci-already-tested.sh "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

    # For every event, pick only wasm's runner. TRUSTED is the trust rule
    # (see the top): false for a pull request from a fork, anything a bot
    # started, and a run by hand asking for the hosted runners. The weekly
    # run asks for them too:
    # it is there to keep the hosted caches alive. RUNNER_VARIABLE is the
    # repository variable WASM_RUNNER (see the top), given for a push and a
    # pull request only, so that a run by hand follows its own input. The
    # script prints its answer and why in one line, in the log and in the
    # run's summary.
    - name: Pick the wasm runner
      id: pick
      env:
        GH_TOKEN: ${{ github.token }}
        TRUSTED: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || endsWith(github.actor, '[bot]') || inputs.runner == 'hosted' || github.event_name == 'schedule') && 'false' || 'true' }}
        RUNNER_INPUT: ${{ github.event_name == 'schedule' && 'hosted' || inputs.runner }}
        RUNNER_VARIABLE: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && vars.WASM_RUNNER || '' }}
      run: sh toolchain/ci-pick-runner.sh >> "$GITHUB_OUTPUT"

  native:
    needs: plan
    if: needs.plan.outputs.tested != 'true'
    name: native (${{ matrix.group }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Four jobs in parallel. unit, sqlite and postgres run the test suites
    # of that group (WIKI_TEST_GROUP). deploy builds wiki-server alone and
    # runs the deploy scripts' tests (the wizard's among them) and the plan
    # job's scripts' tests, which take about four minutes and need no test
    # suite: in the unit job they made it the run's longest.
    strategy:
      fail-fast: false
      matrix:
        group: [unit, sqlite, postgres, deploy]
    env:
      WIKI_TEST_GROUP: ${{ matrix.group == 'deploy' && 'unit' || matrix.group }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # Pin the cabal layout so the store is where the cache steps look for it
    # (cabal otherwise picks XDG directories). Hosted runners only: the pin is
    # for the caches, which self-hosted runners do without.
    - name: Pin the cabal directory
      if: runner.environment == 'github-hosted'
      run: echo "CABAL_DIR=$HOME/.cabal" >> "$GITHUB_ENV"

    - uses: haskell-actions/setup@v2
      if: runner.environment == 'github-hosted'
      id: setup
      with:
        ghc-version: ${{ env.GHC_VERSION }}
        cabal-version: ${{ env.CABAL_VERSION }}
        # The step after the toolchain's updates the index on both kinds of
        # runner.
        cabal-update: false

    # Only for `npm run`: the native commands need no JavaScript packages.
    - name: Setup Node.js
      if: runner.environment == 'github-hosted'
      uses: actions/setup-node@v5
      with:
        node-version: ${{ env.NODE_VERSION }}

    # Cache downloads, not an extracted installation: apt/dpkg must still
    # configure TeX and run its triggers on each fresh hosted runner. Every
    # group restores the archives, the base list's among them (a restore
    # takes about three seconds), so that an install needs no apt-get update
    # and no network when the cache holds the version the runner image's
    # index names (toolchain/ci-native-deps.sh), as on the day the Ubuntu
    # mirror could not be reached.
    - name: Identify the apt cache platform
      id: apt-platform
      run: |
        . /etc/os-release
        echo "os=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
        echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Restore native apt archives
      uses: actions/cache/restore@v5
      id: apt-cache
      with:
        path: ~/.cache/wiki-apt/*.deb
        key: ${{ runner.os }}-${{ runner.arch }}-apt-v1-${{ steps.apt-platform.outputs.os }}-${{ steps.apt-platform.outputs.image }}-${{ hashFiles('toolchain/ci-native-*-packages.txt') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-apt-v1-${{ steps.apt-platform.outputs.os }}-

    - name: Install native test dependencies
      run: sh toolchain/ci-native-deps.sh ${{ (matrix.group == 'unit' || matrix.group == 'deploy') && 'base' || 'full' }}

    # One writer for each shared cache; every native job reads the same apt archives.
    - name: Save native apt archives
      if: matrix.group == 'postgres' && steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.cache/wiki-apt/*.deb
        key: ${{ steps.apt-cache.outputs.cache-primary-key }}

    # libsodium, which every native build links statically:
    # toolchain/libsodium.sh builds the release toolchain/pins.env pins into
    # ~/.wiki-toolchain (under a minute), and the cache keeps the built
    # library, keyed by the pinned version and checksum and by the script
    # that builds it. Its env mode gives the later steps PKG_CONFIG_PATH,
    # LIBRARY_PATH and C_INCLUDE_PATH, through which cabal finds it.
    - name: Read the libsodium pin
      id: libsodium
      run: |
        . toolchain/pins.env
        echo "version=$LIBSODIUM_VERSION" >> "$GITHUB_OUTPUT"
        echo "sha256=$LIBSODIUM_SHA256" >> "$GITHUB_OUTPUT"

    - name: Cache libsodium
      uses: actions/cache@v5
      with:
        path: ~/.wiki-toolchain/libsodium-${{ steps.libsodium.outputs.version }}
        key: ${{ runner.os }}-libsodium-${{ steps.libsodium.outputs.version }}-${{ steps.libsodium.outputs.sha256 }}-${{ hashFiles('toolchain/libsodium.sh') }}

    - name: Build libsodium
      run: |
        sh toolchain/libsodium.sh install
        sh toolchain/libsodium.sh env >> "$GITHUB_ENV"

    - name: Update Cabal package index
      run: cabal update

    # The native store (decision 54 of docs/PLAN.md): one cache entry per
    # cabal version, whatever the compilers. The store keeps each compiler's
    # packages in a directory of its own (store/ghc-9.14.1-..., store/ghc-
    # 9.10.3-...), so the pinned GHC's and the floor's live in the same
    # entry, and cabal decides what to build on top of it. It is carried
    # forward from run to run whatever the project files say: the newest
    # copy of this ref (or of main) for the same cabal and runner kind. Only
    # the unit job saves it, with the floor's dependencies built in too, so
    # the three groups and native-floor never undo each other's copies. Bump
    # the tag (v1) by hand, or run the workflow "Delete a cabal store", to
    # start from an empty store. The key ends in the run's id because a key
    # cannot be overwritten; the ref's older copies are deleted by the job
    # prune-caches, once every job has restored its copy. The last restore key takes the copies saved
    # under the key that named GHC's version, once: remove it at the next
    # bump.
    - name: Restore cached dependencies
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@v5
      id: cache
      env:
        key: ${{ runner.os }}-native-store-cabal-${{ steps.setup.outputs.cabal-version }}-${{ runner.environment }}-v1
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ env.key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ env.key }}-
          ${{ runner.os }}-native-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-

    # The store holds dependencies; this snapshot also keeps the wiki's own
    # object and interface files. It is restored whatever the sources say:
    # the newest copy of this ref (or of main) made by the same compiler on
    # the same kind of runner, then Cabal and GHC rebuild what changed and
    # validate the rest. Only the compiler, the platform and the version tag
    # (v1, bumped by hand) bound the fallback: a new module or flag change
    # does not discard all existing objects. As for the store, the key ends
    # in the run's id and prune-caches deletes the older copies.
    - name: Restore native build directories
      uses: actions/cache/restore@v5
      id: native-build
      env:
        compatibility: ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-native-build-v1-ghc-${{ env.GHC_VERSION }}
      with:
        path: dist-newstyle/native
        key: ${{ env.compatibility }}-cabal-${{ env.CABAL_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ env.compatibility }}-

    # Cheap when the restored store already satisfies the plan, and it keeps
    # dependency failures apart from failures in our own packages.
    - name: Install dependencies
      run: cabal build all --builddir=dist-newstyle/native --only-dependencies

    # The maker's own dependencies (Shake, optparse-applicative, hspec, and
    # brick for its terminal interface), from its own project, into the same
    # store before it is saved, so later runs take them from the cache: the
    # deploy group's wizard test among them, which builds the terminal
    # interface with brick from the store.
    - name: Install the maker's dependencies
      if: matrix.group == 'unit'
      run: cd maker && cabal build all --enable-tests --only-dependencies

    # The oldest supported GHC's dependencies, the wiki's and the maker's,
    # into the same store before it is saved, so that the native-floor job
    # finds them there. The compiler itself is cached by its version; ghcup
    # installs it beside the pinned one without making it the default.
    - name: Cache GHC ${{ env.GHC_FLOOR_VERSION }}
      if: matrix.group == 'unit' && runner.environment == 'github-hosted'
      uses: actions/cache@v5
      with:
        path: /usr/local/.ghcup/ghc/${{ env.GHC_FLOOR_VERSION }}
        key: ${{ runner.os }}-ghcup-ghc-${{ env.GHC_FLOOR_VERSION }}

    - name: Install GHC ${{ env.GHC_FLOOR_VERSION }}'s dependencies
      if: matrix.group == 'unit'
      run: |
        ghcup whereis ghc "$GHC_FLOOR_VERSION" >/dev/null 2>&1 || ghcup install ghc "$GHC_FLOOR_VERSION"
        floor=$(ghcup whereis ghc "$GHC_FLOOR_VERSION")
        cabal build all --only-dependencies -w "$floor" --builddir=dist-newstyle/native-floor
        (cd maker && cabal build all --enable-tests --only-dependencies -w "$floor" --builddir=dist-newstyle/floor)

    # Before the build, so a run that fails on our own code still banks the
    # dependencies it compiled; after them, so a store whose dependencies
    # failed to build never replaces a good one. prune-caches deletes the
    # ref's older copies after the run's jobs.
    - name: Save cached dependencies
      if: matrix.group == 'unit'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ steps.cache.outputs.cache-primary-key }}

    # The upgrade's rehearsal (WP5.75 of docs/PLAN.md) needs the program the
    # base branch would deploy: its wiki-server, built here before this pull
    # request's, from the same checkout and build directory, so that only
    # what differs from the restored snapshot compiles. The base's commit is
    # checked out, built and copied aside, and the pull request's checked out
    # again for the Build step below. Only the sqlite job builds it, and
    # rehearses the upgrade on both databases: building it in the postgres
    # job too cost that job two and a half minutes. The base is the commit
    # the event names, whatever its branch: for a stacked pull request, the
    # head of the branch below it, so that each pull request of a stack
    # rehearses the upgrade from the one before. The upgrade from main to
    # an upper pull request in one step is never rehearsed: its run is not
    # repeated once it is retargeted to main, and a push to main rehearses
    # nothing. Each step of it is rehearsed in its own pull request, and a
    # deploy rehearses the upgrade it makes, from whatever it runs, before
    # it touches the running wiki.
    - name: Build the base branch's wiki-server, for the rehearsal
      if: github.event_name == 'pull_request' && matrix.group == 'sqlite'
      run: |
        head=$(git rev-parse HEAD)
        git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
        git checkout -q FETCH_HEAD
        cabal build wiki-server:exe:wiki-server --builddir=dist-newstyle/native
        cp "$(cabal list-bin -v0 --builddir=dist-newstyle/native wiki-server:exe:wiki-server)" "$RUNNER_TEMP/base-wiki-server"
        git checkout -q "$head"

    - name: Build
      if: matrix.group != 'deploy'
      run: npm run build-native

    # The deploy scripts' tests need only the server, which they serve the
    # static cases with.
    - name: Build wiki-server
      if: matrix.group == 'deploy'
      run: cabal build wiki-server:exe:wiki-server --builddir=dist-newstyle/native

    # Build all native components once per job; the unit job publishes the
    # complete snapshot once the build has passed, even if a later test
    # fails; prune-caches deletes the older copies. Database jobs only read
    # it.
    - name: Save native build directories
      if: matrix.group == 'unit'
      uses: actions/cache/save@v5
      with:
        path: dist-newstyle/native
        key: ${{ steps.native-build.outputs.cache-primary-key }}

    # The bootstrap's second stage and the builds' runner: its own tests,
    # its terminal interface built (with -Werror, as the maker's project
    # sets), then the bootstrap's tests, which run it against fake tools,
    # and the native test groups' check, which runs its `test native`.
    - name: Build and test the maker
      if: matrix.group == 'unit'
      run: |
        cd maker
        cabal build all --enable-tests
        cabal test maker-test

    - name: Check native test groups cover the full suite
      if: matrix.group == 'unit'
      run: |
        server_test=$(cabal list-bin -v0 --builddir=dist-newstyle/native wiki-server:test:wiki-server-test)
        maker=$(cd maker && cabal list-bin -v0 exe:maker)
        node toolchain/test-native-groups.mjs "$server_test" "$maker"

    - name: Test bootstrap scripts
      if: matrix.group == 'unit'
      run: sh toolchain/test-bootstrap.sh

    # The deploy's check of the TeX the PDF exports need, against fake
    # engines (working, failing, hanging, none): ten seconds, and
    # independent of the runner's own TeX.
    - name: Test check-tex.sh
      if: matrix.group == 'unit'
      run: sh toolchain/test-check-tex.sh

    # The changelog job's check, on pull requests made in a repository of
    # its own: a few seconds.
    - name: Test check-changelog.sh
      if: matrix.group == 'unit'
      run: sh toolchain/test-check-changelog.sh

    # The script that starts PostgreSQL for the tests, against containers
    # of the test's own names: started twice it keeps the same container
    # and port, and a host port another process holds does not stop it.
    # About half a minute.
    - name: Test ci-postgres.sh
      if: matrix.group == 'postgres'
      run: sh toolchain/test-ci-postgres.sh

    # The two database groups use separate hosted VMs. Only PostgreSQL
    # needs a container; unit and SQLite never start or discover a cluster.
    - name: Start PostgreSQL for the tests
      if: matrix.group == 'postgres'
      run: sh toolchain/ci-postgres.sh start "$RUNNER_TEMP/postgres-bin" >> "$GITHUB_ENV"

    - name: Test
      if: matrix.group != 'deploy'
      run: npm run test-native

    # Runs of the PostgreSQL tests that share one server, as the sessions
    # on one machine share ci-postgres.sh's container: two at once, and one
    # after a run killed part-way, each in a namespace of its own. About
    # twenty seconds.
    - name: Test runs of the PostgreSQL tests side by side
      if: matrix.group == 'postgres'
      run: sh toolchain/test-postgres-namespaces.sh "$(cabal list-bin -v0 --builddir=dist-newstyle/native wiki-server:test:wiki-server-test)"

    # The upgrade from the base branch, rehearsed as a deploy rehearses it
    # (toolchain/rehearse-ci.sh): the base's wiki-server makes a wiki on a
    # database, and this pull request's migrates a copy of it and checks
    # that it reads the same. The sqlite job does it on SQLite, then starts
    # a PostgreSQL of its own, after its tests so that they never see it,
    # and does it there.
    - name: Rehearse the upgrade from the base branch on SQLite
      if: github.event_name == 'pull_request' && matrix.group == 'sqlite'
      run: |
        new=$(cabal list-bin -v0 --builddir=dist-newstyle/native wiki-server:exe:wiki-server)
        sh toolchain/rehearse-ci.sh "$RUNNER_TEMP/base-wiki-server" "$new"

    - name: Start PostgreSQL for the rehearsal
      if: github.event_name == 'pull_request' && matrix.group == 'sqlite'
      run: sh toolchain/ci-postgres.sh start "$RUNNER_TEMP/postgres-bin" >> "$GITHUB_ENV"

    - name: Rehearse the upgrade from the base branch on PostgreSQL
      if: github.event_name == 'pull_request' && matrix.group == 'sqlite'
      run: |
        new=$(cabal list-bin -v0 --builddir=dist-newstyle/native wiki-server:exe:wiki-server)
        sh toolchain/rehearse-ci.sh "$RUNNER_TEMP/base-wiki-server" "$new" --postgres

    # The comparison a move from SQLite to PostgreSQL makes
    # (deploy-local.sh --move-to-postgres, WP5.80b): this pull request's
    # wiki-server as the old program and the new, the old on SQLite and the
    # new on a copy in PostgreSQL.
    - name: Rehearse a move from SQLite to PostgreSQL
      if: github.event_name == 'pull_request' && matrix.group == 'sqlite'
      run: |
        new=$(cabal list-bin -v0 --builddir=dist-newstyle/native wiki-server:exe:wiki-server)
        sh toolchain/rehearse-ci.sh "$new" "$new" --move

    - name: Stop PostgreSQL
      if: always() && (matrix.group == 'postgres' || (github.event_name == 'pull_request' && matrix.group == 'sqlite'))
      run: sh toolchain/ci-postgres.sh stop

    # The deploy scripts against fakes of systemd, ufw, sudo, tailscale (and
    # its serve) and curl, in a temporary home: nothing on the runner is
    # touched, and every server the cases start is stopped when they end.
    # Its last stage serves the static cases with the real wiki-server, the
    # one the Build wiki-server step made (cabal list-bin in dist-newstyle/native). About
    # two minutes.
    #
    # First, with WIKI_TEST_WIZARD=1, the wizard's test (toolchain/test-configure.sh):
    # it builds maker-tui with the maker's own project and checks the
    # command lines the wizard builds, then drives its screens through
    # script(1), and fails rather than skip that case when script(1) is
    # missing on CI. Its brick and vty cost nothing to build here: this job
    # restored the native store above, under the same key prefix as every
    # group, and that copy is the one the unit group of an earlier run (this
    # ref's, or main's) saved after "Install the maker's dependencies". The
    # wizard's build plans brick and vty with the same unit ids as that step
    # (`cabal build exe:maker-tui` and `cabal build all --enable-tests
    # --only-dependencies` in maker/ give the same ids), so cabal finds them
    # in the store and compiles only the maker's own modules: its library,
    # which the deploy's tests build anyway, and the terminal interface's.
    # brick is compiled here only on the first run after the store starts
    # empty or the maker's dependencies change: the unit group of that run
    # saves it for the next.
    - name: Test the deploy scripts (deploy-local, undeploy-local, the static servers, the wizard)
      if: matrix.group == 'deploy'
      env:
        WIKI_TEST_WIZARD: 1
      run: sh toolchain/test-deploy-local.sh

    # The plan job's scripts, against a fake GitHub API: a second each.
    - name: Test ci-already-tested.sh
      if: matrix.group == 'deploy'
      run: sh toolchain/test-ci-already-tested.sh

    # The native jobs' apt install, against a fake apt-get: no update when
    # the archive cache serves, a bounded one otherwise. Takes about two
    # seconds, without root or the network.
    - name: Test ci-native-deps.sh
      if: matrix.group == 'deploy'
      run: sh toolchain/test-ci-native-deps.sh

    - name: Test ci-pick-runner.sh
      if: matrix.group == 'deploy'
      run: sh toolchain/test-ci-pick-runner.sh

    - name: Test ci-prune-caches.sh
      if: matrix.group == 'deploy'
      run: sh toolchain/test-ci-prune-caches.sh

    # The rehearsal script's ports, against a fake old and new wiki-server:
    # port 0 for the old server's listeners, the admin listener's address
    # read from its log, and two runs side by side. Six seconds.
    - name: Test rehearse-ci.sh
      if: matrix.group == 'deploy'
      run: sh toolchain/test-rehearse-ci.sh

    # wiki-server with the cabal flag postgres off, as a deployment on
    # SQLite builds it (toolchain/deploy-local.sh --sqlite). CPP gives that
    # build other code, so a warning only it has fails here, and its unit
    # tests run. Last, in the same build directory, so that only
    # wiki-server compiles again: every step before it had the flag on.
    - name: Build and test wiki-server without PostgreSQL
      if: matrix.group == 'unit'
      run: |
        cabal build wiki-server --builddir=dist-newstyle/native --constraint='wiki-server -postgres'
        cabal test wiki-server:test:wiki-server-test --builddir=dist-newstyle/native --constraint='wiki-server -postgres'

    - name: Report incremental build size
      if: matrix.group == 'unit'
      run: du -sh dist-newstyle/native | tee -a "$GITHUB_STEP_SUMMARY"

  # The oldest GHC the native build supports (decision 53), and on the
  # weekly run and by hand the one between it and the pinned one: the
  # wiki's packages and the maker built, with -Werror as cabal.project sets,
  # tests not run (the native job runs them with the pinned GHC). Its own
  # build directory, not cached. The store is the native job's, restored
  # and never saved here: the unit job installs the floor's dependencies.
  # The versions are written out in the matrix, which cannot read env:
  # GHC_FLOOR_VERSION above, and 9.12's newest release.
  native-floor:
    needs: plan
    if: needs.plan.outputs.tested != 'true'
    name: native (GHC ${{ matrix.ghc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["9.10.3", "9.12.4"]' || '["9.10.3"]') }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Pin the cabal directory
      run: echo "CABAL_DIR=$HOME/.cabal" >> "$GITHUB_ENV"

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.CABAL_VERSION }}
        cabal-update: false

    # The native job's apt archives, restored and never saved here, as
    # there: the install needs no update and no download when they hold the
    # version the runner image's index names.
    - name: Identify the apt cache platform
      id: apt-platform
      run: |
        . /etc/os-release
        echo "os=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
        echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Restore native apt archives
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/wiki-apt/*.deb
        key: ${{ runner.os }}-${{ runner.arch }}-apt-v1-${{ steps.apt-platform.outputs.os }}-${{ steps.apt-platform.outputs.image }}-${{ hashFiles('toolchain/ci-native-*-packages.txt') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-apt-v1-${{ steps.apt-platform.outputs.os }}-

    - name: Install the system packages the build links with
      run: sh toolchain/ci-native-deps.sh base

    # libsodium, which every native build links statically:
    # toolchain/libsodium.sh builds the release toolchain/pins.env pins into
    # ~/.wiki-toolchain (under a minute), and the cache keeps the built
    # library, keyed by the pinned version and checksum and by the script
    # that builds it. Its env mode gives the later steps PKG_CONFIG_PATH,
    # LIBRARY_PATH and C_INCLUDE_PATH, through which cabal finds it.
    - name: Read the libsodium pin
      id: libsodium
      run: |
        . toolchain/pins.env
        echo "version=$LIBSODIUM_VERSION" >> "$GITHUB_OUTPUT"
        echo "sha256=$LIBSODIUM_SHA256" >> "$GITHUB_OUTPUT"

    - name: Cache libsodium
      uses: actions/cache@v5
      with:
        path: ~/.wiki-toolchain/libsodium-${{ steps.libsodium.outputs.version }}
        key: ${{ runner.os }}-libsodium-${{ steps.libsodium.outputs.version }}-${{ steps.libsodium.outputs.sha256 }}-${{ hashFiles('toolchain/libsodium.sh') }}

    - name: Build libsodium
      run: |
        sh toolchain/libsodium.sh install
        sh toolchain/libsodium.sh env >> "$GITHUB_ENV"

    - name: Update Cabal package index
      run: cabal update

    - name: Restore cached dependencies
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ runner.os }}-native-store-cabal-${{ steps.setup.outputs.cabal-version }}-${{ runner.environment }}-v1-${{ github.run_id }}
        restore-keys: ${{ runner.os }}-native-store-cabal-${{ steps.setup.outputs.cabal-version }}-${{ runner.environment }}-v1-

    - name: Build the wiki
      run: |
        sh toolchain/changelog-stamp.sh
        cabal build all --builddir=dist-newstyle/native-floor

    - name: Build the maker
      run: cd maker && cabal build all --enable-tests --builddir=dist-newstyle/floor

  # The page, built and tested on the runner plan picked (see the top). Its
  # steps are shared with wasm-warm and smoke-throttled below (the anchor
  # wasm-steps); the steps that test the page, or keep it, run only here
  # (github.job is wasm), but for smoke-throttled's own.
  wasm:
    needs: plan
    if: needs.plan.outputs.tested != 'true'
    # The runner plan picked; see the top.
    runs-on: ${{ needs.plan.outputs.runner }}
    permissions:
      contents: read
    # The page is built, tested and kept for GitHub Pages, which serves a
    # project's site under the repository's name: every run builds it so,
    # pull requests too, since main is fast-forwarded to a pull request's
    # head and the deploy then takes the page that pull request's run built
    # (see the plan and deploy jobs). build-wasm.sh writes it into each
    # page's <base href> and every link; the smoke test serves the build
    # under it. Change it here if the site moves to a domain of its own (/).
    env:
      HALOGEN_BASE_PATH: /${{ github.event.repository.name }}/

    steps: &wasm-steps
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        clean: ${{ runner.environment != 'self-hosted' }}

    # Checkout normally deletes ignored build directories. On the owner's
    # runner keep only these two, clean every other untracked file, and
    # discard the generated site so every run builds it afresh.
    - name: Clean the self-hosted workspace, keeping incremental builds
      if: runner.environment == 'self-hosted'
      run: |
        git clean -ffdx -e /dist-newstyle/native/ -e /dist-newstyle/native-fast/ -e /dist-newstyle/wasm/
        rm -rf dist-newstyle/wasm/public

    - name: Pin the cabal directory
      if: runner.environment == 'github-hosted'
      run: echo "CABAL_DIR=$HOME/.cabal" >> "$GITHUB_ENV"

    - name: Setup Node.js
      if: runner.environment == 'github-hosted'
      uses: actions/setup-node@v5
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm

    # Only ~/.ghc-wasm (wasi-sdk, binaryen, wasmtime, its own Node) and the
    # one cross compiler are cached: ghcup's base directory is
    # /usr/local/.ghcup on the runner image and also holds the image's own
    # GHC, cabal, stack and HLS, which are not ours to archive.
    - name: Cache wasm sysroot
      if: runner.environment == 'github-hosted'
      uses: actions/cache@v5
      with:
        path: ~/.ghc-wasm
        key: ${{ runner.os }}-ghc-wasm-sysroot-${{ env.GHC_WASM_META_REV }}

    - name: Cache wasm cross-compiler
      if: runner.environment == 'github-hosted'
      uses: actions/cache@v5
      with:
        path: /usr/local/.ghcup/ghc/wasm32-wasi-${{ env.WASM_GHC_VERSION }}
        key: ${{ runner.os }}-ghcup-wasm32-wasi-${{ env.WASM_GHC_VERSION }}

    # Exactly haskell-halogen's steps. Each half checks for itself rather than
    # trusting cache-hit, so a cache that turns out not to carry a toolchain
    # repairs itself instead of failing the build several steps later. The
    # wasm environment is sourced here only: the build scripts source it
    # themselves, and exporting its CC and its Node for every later step would
    # reach the native builds and the npm commands too.
    - name: Install GHC WebAssembly toolchain
      if: runner.environment == 'github-hosted'
      run: |
        mkdir -p "$RUNNER_TEMP/ghc-wasm-meta"
        curl --fail --location --retry 5 "https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta/-/archive/$GHC_WASM_META_REV/ghc-wasm-meta-$GHC_WASM_META_REV.tar.gz" | tar xz --strip-components=1 --directory "$RUNNER_TEMP/ghc-wasm-meta"
        if [ ! -x "$HOME/.ghc-wasm/add_to_github_path.sh" ]; then
          SKIP_GHC=1 FLAVOUR="$GHC_WASM_FLAVOUR" "$RUNNER_TEMP/ghc-wasm-meta/setup.sh"
        fi
        # The marker toolchain/bootstrap.sh leaves on a sysroot it installed,
        # naming the ghc-wasm-meta revision: its readiness gate, which every
        # npm command runs, takes the sysroot by it (the cache is keyed by the
        # same revision).
        touch "$HOME/.ghc-wasm/.bootstrap-$GHC_WASM_META_REV"
        # shellcheck source=/dev/null
        . ~/.ghc-wasm/env
        if ! ghcup whereis cabal "$CABAL_VERSION" >/dev/null 2>&1; then
          ghcup install cabal "$CABAL_VERSION"
        fi
        ghcup set cabal "$CABAL_VERSION"
        if ! ghcup whereis ghc "wasm32-wasi-$WASM_GHC_VERSION" >/dev/null 2>&1; then
          # CONFIGURE_ARGS is a list of arguments, split on purpose.
          # shellcheck disable=SC2086
          ghcup -s "file://$RUNNER_TEMP/ghc-wasm-meta/ghcup-wasm-0.0.9.yaml" install ghc "wasm32-wasi-$WASM_GHC_VERSION" --set -- $CONFIGURE_ARGS
        fi
        ghcup set ghc "wasm32-wasi-$WASM_GHC_VERSION"

    # The wasm job needs the host GHC as well: the prerender (build-wasm) and
    # the hspec-halogen executable that runs browser suites (test-wasm) are
    # native programs. The runner image ships this GHC under ghcup, so this
    # usually only makes it the default.
    - name: Install host GHC
      if: runner.environment == 'github-hosted'
      run: |
        if ! ghcup whereis ghc "$GHC_VERSION" >/dev/null 2>&1; then
          ghcup install ghc "$GHC_VERSION"
        fi
        ghcup set ghc "$GHC_VERSION"

    # The cross compiler's own bin directory as well as ghcup's: the versioned
    # links in ghcup's bin are made at install time, so they are missing when
    # the compiler came back from the cache instead.
    - name: Activate toolchain
      if: runner.environment == 'github-hosted'
      run: |
        echo "$(ghcup whereis basedir)/ghc/wasm32-wasi-$WASM_GHC_VERSION/bin" >> "$GITHUB_PATH"
        echo "$(ghcup whereis basedir)/bin" >> "$GITHUB_PATH"

    # Everything the steps above install on a hosted runner, the host GHC and
    # the cross compiler included (the bootstrap installs the latter through
    # ghcup, so its versioned links are in ghcup's bin directory), and Chromium.
    - name: Install the toolchain (self-hosted)
      if: runner.environment == 'self-hosted'
      run: |
        sh toolchain/bootstrap.sh toolchain
        sh toolchain/bootstrap.sh path >> "$GITHUB_PATH"

    # The prerender is built natively with every package's dependencies,
    # the server's among them: libpq's and SQLite's development files, as in
    # the native job, and libsodium (below). A self-hosted runner has both
    # from the bootstrap.
    - name: Install libpq and SQLite (hosted)
      if: runner.environment == 'github-hosted'
      run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libpq-dev libsqlite3-dev

    # libsodium, which every native build links statically:
    # toolchain/libsodium.sh builds the release toolchain/pins.env pins into
    # ~/.wiki-toolchain (under a minute), and the cache keeps the built
    # library, keyed by the pinned version and checksum and by the script
    # that builds it. Its env mode gives the later steps PKG_CONFIG_PATH,
    # LIBRARY_PATH and C_INCLUDE_PATH, through which cabal finds it. A
    # self-hosted runner's bootstrap has built it already, and keeps it, so
    # only its variables are written there.
    - name: Read the libsodium pin
      id: libsodium
      run: |
        . toolchain/pins.env
        echo "version=$LIBSODIUM_VERSION" >> "$GITHUB_OUTPUT"
        echo "sha256=$LIBSODIUM_SHA256" >> "$GITHUB_OUTPUT"

    - name: Cache libsodium
      if: runner.environment == 'github-hosted'
      uses: actions/cache@v5
      with:
        path: ~/.wiki-toolchain/libsodium-${{ steps.libsodium.outputs.version }}
        key: ${{ runner.os }}-libsodium-${{ steps.libsodium.outputs.version }}-${{ steps.libsodium.outputs.sha256 }}-${{ hashFiles('toolchain/libsodium.sh') }}

    - name: Build libsodium
      run: |
        sh toolchain/libsodium.sh install
        sh toolchain/libsodium.sh env >> "$GITHUB_ENV"

    - name: Install JavaScript dependencies
      run: npm ci

    # The supply chain, checked against the advisories npm knows (WP5.21 of
    # docs/PLAN.md): a known vulnerability of high severity or worse in a
    # package the page ships (package.json's dependencies, all bundled into
    # it) fails the build; one in a development tool only (esbuild,
    # Playwright, http-server) is reported as a warning.
    - name: Audit the JavaScript dependencies
      run: |
        if ! npm audit --audit-level=high; then
          echo "::warning title=npm audit::a known vulnerability in the JavaScript dependencies (above); the next step fails if the page ships it"
        fi
        npm audit --omit=dev --audit-level=high

    - name: Update Cabal package index
      run: cabal update

    # The wasm store (decision 54): one cache entry per cabal version for
    # both compilers this job uses (cabal partitions the store by compiler),
    # saved by this job only, and its older copies pruned by prune-caches,
    # as the native job's are. server-page.yml starts its own -O2 store from
    # it the first time, and saves only that one. The last restore
    # key takes the copies saved under the key that named the compilers'
    # versions, once: remove it at the next bump of the tag.
    - name: Restore cached dependencies
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@v5
      id: cache
      env:
        key: ${{ runner.os }}-wasm-store-cabal-${{ env.CABAL_VERSION }}-${{ runner.environment }}-v1
      with:
        path: ${{ env.CABAL_DIR }}/store
        key: ${{ env.key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ env.key }}-
          ${{ runner.os }}-wasm-${{ env.WASM_GHC_VERSION }}-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}-

    # Separate from native's snapshot: the wasm job also builds native
    # prerender, browser-test and smoke-test programs. Only Cabal's build
    # directories are cached; public/ is generated afresh by the maker's build.
    # Restored whatever the sources say, as native's snapshot is: the newest
    # copy of this ref (or of main) from the same compilers, runner kind and
    # version tag (v2, bumped by hand); Cabal and GHC validate their own
    # metadata and rebuild affected modules. Hosted and self-hosted stores
    # have different registration paths. Saved at the end of the job, once
    # everything has passed, as before (the step that both restored and
    # saved did so then); prune-caches deletes the ref's older copies.
    - name: Restore wasm and native build directories
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@v5
      id: wasm-build
      env:
        compatibility: ${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-wasm-build-v2-ghc-${{ env.GHC_VERSION }}-wasm-${{ env.WASM_GHC_VERSION }}
      with:
        path: |
          dist-newstyle/native-fast
          dist-newstyle/wasm/build
          dist-newstyle/wasm/cache
          dist-newstyle/wasm/packagedb
          dist-newstyle/wasm/src
        key: ${{ env.compatibility }}-cabal-${{ env.CABAL_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ env.compatibility }}-

    # Everything the later steps take from the store, built here so that it
    # is saved even if they fail: the native dependencies of the prerender,
    # the maker's (Shake and the rest: `npm run` builds and runs the maker),
    # the hspec-halogen executable (a haskell-halogen package, so it lives in
    # the store, and `--only-dependencies` does not reach it), and the wasm
    # dependencies, with the arguments toolchain/bootstrap.sh's warm-up uses.
    - name: Install dependencies
      run: |
        cabal build all --only-dependencies --project-file=cabal-native-fast.project --builddir=dist-newstyle/native-fast
        (cd maker && cabal build exe:maker --only-dependencies)
        sh toolchain/build-hspec-halogen.sh
        (
          # shellcheck source=/dev/null
          . ~/.ghc-wasm/env
          rm -f dist-newstyle/wasm/cache/compiler
          cabal build all --only-dependencies --project-file=cabal-wasm.project \
            --builddir=dist-newstyle/wasm \
            --with-compiler="$(command -v wasm32-wasi-ghc)" \
            --with-hc-pkg="$(command -v wasm32-wasi-ghc-pkg)" \
            --with-hsc2hs="$(command -v wasm32-wasi-hsc2hs)"
        )

    - name: Save cached dependencies
      if: runner.environment == 'github-hosted' && github.job != 'smoke-throttled'
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CABAL_DIR }}/store
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Build
      run: npm run build-wasm

    # Before the tests: browser suites and the smoke test run in headless
    # Chromium, Playwright's headless shell. On a hosted runner it is cached
    # by the lockfile, which pins the playwright version, so on a hit the
    # install below is a no-op and on a miss it is the CDN download alone
    # (a second). Not `--with-deps`: the runner image already has every
    # library the shell needs, and the apt-get that option runs fetched
    # fonts and upgrades the tests do not use, at times from a mirror at
    # 34 kB/s for ten minutes (haskell-halogen's #89 has the log). Should a
    # future image drop a library, the suites fail with Playwright's message
    # naming it, and `--with-deps` comes back for that library. A self-hosted
    # runner has the Debian packages installed once by hand (the README lists
    # them), and the bootstrap has already installed this Chromium and checked
    # that it starts, so there the install only confirms it.
    - name: Cache Chromium
      if: runner.environment == 'github-hosted' && github.job != 'wasm-warm'
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

    - name: Install Chromium
      if: runner.environment == 'github-hosted' && github.job != 'wasm-warm'
      run: npx playwright install --only-shell chromium

    - name: Install Chromium (self-hosted)
      if: runner.environment == 'self-hosted'
      run: npx playwright install --only-shell chromium

    - name: Test
      if: github.job == 'wasm'
      env:
        HSPEC_HALOGEN_JOBS: '2'
      run: npm run test-wasm

    # The smoke suites in Haskell (wiki-smoke; WP5.98 of docs/PLAN.md):
    # native programs, built here with the host GHC into
    # dist-newstyle/native-fast, that drive the demo just built in Chromium
    # through haskell-halogen-playwright, which waits after every action
    # until the page's program says it is idle. toolchain/smoke-suite.sh
    # requires the build, so a missing demo fails rather than passes as
    # pending. The first checks that those waits hold on the wiki's own
    # pages; the second takes the README's screenshots (into a directory of
    # the runner's, not docs/screenshots) and checks each is under 300 KB.
    - name: Check the smoke tests' waits on the demo
      if: github.job == 'wasm'
      run: sh toolchain/smoke-suite.sh waits

    - name: Take the README's screenshots from the demo
      if: github.job == 'wasm'
      env:
        WIKI_SCREENSHOTS_DIR: ${{ runner.temp }}/screenshots
      run: sh toolchain/smoke-suite.sh screenshots

    # The demo's smoke test with every page's processor four times slower,
    # in smoke-throttled's run of these steps only (see that job). Each call
    # of the driver may take four times as long too: the plain 30 seconds
    # times the throttle, the rule wiki-smoke's Wiki.Smoke.Demo applies by
    # itself when no timeout is given, written here so the job says it.
    - name: Smoke-test the demo with the processor throttled
      if: github.job == 'smoke-throttled'
      env:
        HALOGEN_PLAYWRIGHT_THROTTLE: '4'
        HALOGEN_PLAYWRIGHT_TIMEOUT: '120000'
      run: sh toolchain/smoke-suite.sh demo

    # Independent SQLite and PostgreSQL smoke runs can overlap. PostgreSQL
    # uses the container toolchain/ci-postgres.sh starts, as the native job's
    # tests do; without Docker (a self-hosted runner) only on SQLite, and
    # it says so.
    - name: Start PostgreSQL for the smoke test
      if: github.job == 'wasm'
      run: |
        if vars=$(sh toolchain/ci-postgres.sh start "$RUNNER_TEMP/postgres-bin"); then
          printf '%s\n' "$vars" >> "$GITHUB_ENV"
        elif [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
          exit 1
        else
          echo "::warning::Docker does not answer on this runner: the smoke test's server runs on SQLite only."
        fi

    # The demo's smoke test (wiki-smoke-demo, in Haskell), then the
    # server's build against a real wiki-server and the other node programs
    # (toolchain/smoke-test.sh).
    - name: Smoke-test the page in a browser
      if: github.job == 'wasm'
      run: npm run smoke-test

    - name: Stop PostgreSQL
      if: always() && github.job == 'wasm'
      run: sh toolchain/ci-postgres.sh stop

    - name: Report incremental build sizes
      run: |
        du -sh dist-newstyle/native-fast | tee -a "$GITHUB_STEP_SUMMARY"
        du -sh --exclude=public dist-newstyle/wasm | tee -a "$GITHUB_STEP_SUMMARY"

    # The paths are the restore step's.
    - name: Save wasm and native build directories
      if: runner.environment == 'github-hosted' && github.job != 'smoke-throttled'
      uses: actions/cache/save@v5
      with:
        path: |
          dist-newstyle/native-fast
          dist-newstyle/wasm/build
          dist-newstyle/wasm/cache
          dist-newstyle/wasm/packagedb
          dist-newstyle/wasm/src
        key: ${{ steps.wasm-build.outputs.cache-primary-key }}

    # The built page, kept with the run as the artifact `app`: the deploy job
    # publishes it, from this run or, on a push to main the plan job
    # skipped, from the pull request's run that built it. Three days is long
    # enough for a pull request to be fast-forwarded onto main, and a run
    # whose page has expired by then is not counted as tested (the full CI
    # runs again and keeps a page of its own). While the repository is
    # private, only on a hosted runner: the account's artifact storage quota
    # refused uploads then, and nothing is deployed anyway.
    - name: Upload the built page
      if: github.job == 'wasm' && (runner.environment == 'github-hosted' || github.event.repository.private == false)
      uses: actions/upload-artifact@v5
      with:
        name: app
        path: dist-newstyle/wasm/public/app/
        if-no-files-found: error
        retention-days: 3

  # The wasm job's steps on a hosted runner, on a push to main whose page was
  # not built on one (the owner's machine took it, or the plan skipped it as
  # tested by its pull request), only to save the hosted wasm store and build
  # directories on main: the owner's machine saves none to GitHub, so main had
  # no hosted copy, and a pull request whose page went to the hosted runners
  # restored nothing and compiled every dependency (run 42232724715). It runs
  # no test (github.job is wasm-warm), its failure fails nothing, and deploy does
  # not wait for it; prune-caches does.
  wasm-warm:
    needs: plan
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.plan.outputs.tested == 'true' || needs.plan.outputs.runner != 'ubuntu-latest') }}
    name: wasm (hosted cache)
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HALOGEN_BASE_PATH: /${{ github.event.repository.name }}/
    steps: *wasm-steps

  # The demo's smoke test again, with every page's processor four times
  # slower (HALOGEN_PLAYWRIGHT_THROTTLE=4; WP5.98 of docs/PLAN.md): a test
  # that passes only because the page is quick enough fails here, so races
  # between the test and the page, or within the page, are found on purpose
  # rather than on someone's pull request. It runs the wasm job's steps on
  # the same runner, after it, so the build is the one wasm saved or left
  # there, and its own step is the only test it runs. Weekly (the schedule
  # above) and by hand only, and never for a pull request, which does not
  # wait for it: on a push to main the plan usually skips wasm, as the pull
  # request's run tested the tree, and a throttled run for every merge would
  # then build the page again for a check whose purpose is a regular search,
  # which the weekly run makes. A failure fails the run it is in; deploy does
  # not wait for it.
  smoke-throttled:
    needs: [plan, wasm]
    if: >-
      ${{ !cancelled() && needs.wasm.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    name: smoke test, throttled
    runs-on: ${{ needs.plan.outputs.runner }}
    permissions:
      contents: read
    env:
      HALOGEN_BASE_PATH: /${{ github.event.repository.name }}/
    steps: *wasm-steps

  format:
    needs: plan
    if: needs.plan.outputs.tested != 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Cache fourmolu
      if: runner.environment == 'github-hosted'
      uses: actions/cache@v5
      with:
        path: ~/fourmolu
        key: ${{ runner.os }}-fourmolu-${{ env.FOURMOLU_VERSION }}-${{ env.FOURMOLU_SHA256 }}

    # The release's zip, checked against the pinned checksum, with the one
    # binary inside it. The cache key carries the checksum, so a restored
    # binary is one made from a zip that passed the check.
    - name: Install fourmolu
      if: runner.environment == 'github-hosted'
      run: |
        mkdir -p ~/fourmolu
        if [ ! -x ~/fourmolu/fourmolu ]; then
          zip="$HOME/fourmolu/fourmolu-$FOURMOLU_VERSION-linux-x86_64.zip"
          curl --fail --location --retry 5 --output "$zip" \
            "https://github.com/fourmolu/fourmolu/releases/download/v$FOURMOLU_VERSION/fourmolu-$FOURMOLU_VERSION-linux-x86_64.zip"
          printf '%s  %s\n' "$FOURMOLU_SHA256" "$zip" | sha256sum --check
          unzip -q -o -j "$zip" '*/fourmolu' -d ~/fourmolu
          chmod 755 ~/fourmolu/fourmolu
          rm "$zip"
        fi
        ~/fourmolu/fourmolu --version
        echo ~/fourmolu >> "$GITHUB_PATH"

    # The bootstrap installs fourmolu at the same pin (and checks the same
    # checksum, once there is one) with the rest of the toolchain, which a
    # self-hosted runner has anyway for the other jobs.
    - name: Install the toolchain (self-hosted)
      if: runner.environment == 'self-hosted'
      run: |
        sh toolchain/bootstrap.sh toolchain
        sh toolchain/bootstrap.sh path >> "$GITHUB_PATH"

    - name: Check formatting
      run: |
        fourmolu --version
        sh run_fourmolu.sh --mode check

  # The demo on GitHub Pages: the page the wasm job built for the Pages base
  # path, from this run, or on a push the plan job found already tested,
  # from the pull request's run that built it (ci-already-tested.sh checked
  # that it still has it). Only from main (a push, or a run by hand there,
  # to redeploy), once every build job has passed or been skipped as
  # tested, and only once the repository is public: Pages on a private
  # repository of a free account refuses to deploy, so until then the job
  # is skipped, as its name says, rather than making main red.
  # The caches native and wasm save are saved under keys that end in the
  # run's id, since a cache key cannot be overwritten; this job then deletes
  # the ref's older copies, so that each ref keeps one copy of each cache
  # (the repository's 10 GB limit otherwise evicted main's). It runs once
  # every job that restores a cache has ended, never beside them: an older
  # copy deleted while a job was still looking it up left that job with no
  # store at all and every dependency to build again (native (sqlite) in
  # run 42228528344). The keys are the ones the saves used; a cache that
  # was not saved this run (the wasm job on the owner's machine, a job that
  # failed before its save or was skipped) is not listed, and the script then
  # deletes nothing under its prefix. On a push to main it runs after
  # wasm-warm even when the plan skipped the other jobs. A cancelled run prunes nothing: the next run
  # does.
  prune-caches:
    name: prune older cache copies
    needs: [plan, native, native-floor, wasm, wasm-warm]
    if: ${{ !cancelled() && (needs.plan.outputs.tested != 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Prune the native store
      env:
        PREFIX: ${{ runner.os }}-native-store-cabal-${{ env.CABAL_VERSION }}-github-hosted-v1-
      run: sh toolchain/ci-prune-caches.sh "$PREFIX" "$PREFIX$RUN"

    - name: Prune the native build directories
      env:
        PREFIX: ${{ runner.os }}-${{ runner.arch }}-github-hosted-native-build-v1-ghc-${{ env.GHC_VERSION }}-
      run: sh toolchain/ci-prune-caches.sh "$PREFIX" "${PREFIX}cabal-$CABAL_VERSION-$RUN"

    - name: Prune the wasm store
      env:
        PREFIX: ${{ runner.os }}-wasm-store-cabal-${{ env.CABAL_VERSION }}-github-hosted-v1-
      run: sh toolchain/ci-prune-caches.sh "$PREFIX" "$PREFIX$RUN"

    - name: Prune the wasm and native build directories
      env:
        PREFIX: ${{ runner.os }}-${{ runner.arch }}-github-hosted-wasm-build-v2-ghc-${{ env.GHC_VERSION }}-wasm-${{ env.WASM_GHC_VERSION }}-
      run: sh toolchain/ci-prune-caches.sh "$PREFIX" "${PREFIX}cabal-$CABAL_VERSION-$RUN"

  deploy:
    name: deploy (to GitHub Pages, once the repository is public)
    needs: [plan, native, wasm, format]
    if: >-
      ${{ !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.event.repository.private == false &&
      (needs.plan.outputs.tested == 'true' ||
      (needs.native.result == 'success' && needs.wasm.result == 'success' && needs.format.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, queued rather than cancelled by another
    # run's (a run by hand beside a push). A newer push to main still cancels
    # this whole run, deploy included, as the workflow's group says, and
    # deploys its own page.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
    # Into the job's own temporary directory, which the runner empties for
    # each job: the self-hosted runner keeps its workspace between runs, and
    # this job checks nothing out (which would clean it), so a page
    # downloaded into the workspace would be laid over the files of the
    # last deploy's, and a file the new build no longer has would be
    # published again.
    - name: Download the built page
      uses: actions/download-artifact@v5
      with:
        name: app
        path: ${{ runner.temp }}/app
        run-id: ${{ needs.plan.outputs.tested == 'true' && needs.plan.outputs.run_id || github.run_id }}
        github-token: ${{ github.token }}

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v6

    # The page has its base path in every <base href> and link, so it works
    # only where it was built to be served. Pages says where that is: under
    # the repository's name, or at the root of a custom domain. A page built
    # for elsewhere is refused here rather than published broken.
    - name: Check the page was built for where Pages serves it
      env:
        PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      run: |
        expected="${PAGES_BASE_PATH%/}/"
        built=$(sed -n 's/.*<base href="\([^"]*\)">.*/\1/p' "$RUNNER_TEMP/app/index.html" | head -n 1)
        printf 'Pages serves the site at %s; the page was built for %s.\n' "$expected" "$built"
        if [ "$built" != "$expected" ]; then
          echo "::error::The page was built for the base path $built, but Pages serves it at $expected: set HALOGEN_BASE_PATH in the wasm job to $expected."
          exit 1
        fi

    - name: Upload the page for Pages
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ runner.temp }}/app

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
