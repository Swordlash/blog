name: Server page

# The two pages of each commit, built here so that a machine that cannot
# build them (no npm registry, no wasm toolchain) can deploy them:
#
#   - the page wiki-server serves, dist-newstyle/wasm-opt/public/app
#     (`WIKI_BACKEND=server HALOGEN_BASE_PATH=/ npm run build-wasm-opt`):
#     `sh toolchain/deploy-local.sh --backend-only[=REF]` downloads it and
#     builds wiki-server alone;
#   - the serverless demo's, a prerendered page per route with the wiki
#     kept in the browser, dist-newstyle/wasm-opt/public/demo
#     (`WIKI_BACKEND=demo`, the same build with the pages written for the
#     demo): `sh toolchain/deploy-local.sh --static --backend-only[=REF]`
#     downloads it and builds nothing, serving it with Node.
#
# Both are the production builds toolchain/deploy-local.sh makes on a
# machine that can. In the second build cabal finds nothing to compile,
# and only the steps after it run again: the JSFFI glue, wasm-opt, the
# bundle and the prerender.
#
# Each is kept as a release asset, a zip of the directory's contents, since
# a release asset of a public repository downloads without a token and a
# workflow artifact does not:
#
#   - for main, on the pre-release main-latest, made by the first run and
#     updated by every push to main after: app-server-<full commit
#     hash>.zip and app-demo-<full commit hash>.zip for each of main's
#     newest five commits with a page (the two of an older commit are
#     deleted together), the release's text listing them;
#   - for a tag, on that tag's release, made if there is none:
#     app-server-<tag>.zip and app-demo-<tag>.zip, kept for good.
#
# A push to main that changes Markdown alone builds no page, as CI builds
# nothing for it: its page is that of the commit before, which the deploy
# script takes for it. The Markdown compiled into the programs is the
# exception (see the filter below). The tag main-latest is made by this
# workflow through the API, which starts no run of it, and is ignored
# anyway.
#
# Apart from build.yml so that a tag's push runs this alone, and so that
# a push to main builds the page whatever build.yml's plan job decides (it
# skips its build jobs for a tree a pull request has tested). On GitHub's
# hosted runners always: the steps that set the toolchain up are those of
# build.yml's wasm job on a hosted runner, and its caches are read, with a
# store and build directories of this build's own, since every dependency
# is compiled at -O2 here. The first run compiles all of them, which takes
# an hour or more; later runs only what changed.
on:
  push:
    branches:
      - main
    tags:
      - '**'
      - '!main-latest'
    # Every file but Markdown, and the Markdown compiled into the programs:
    # the built-in templates and the Markdown reference (docs/markdown.md,
    # through the link in wiki-core/reference). build.yml says why `paths`.
    paths:
      - '**'
      - '!**.md'
      - 'wiki-core/templates/**'
      - 'wiki-core/reference/**'
      - 'docs/markdown.md'
  workflow_dispatch:

# One build of a ref at a time; a newer push to main waits for the one
# under way rather than cancelling it, so that its commit gets its page.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# The same pins as build.yml's (and toolchain/bootstrap.sh's): change them
# together.
env:
  GHC_VERSION: '9.14.1'
  CABAL_VERSION: '3.16.1.0'
  WASM_GHC_VERSION: '9.14.1.20260731'
  GHC_WASM_META_REV: '358ea50b8496a69da6ce375c0c58bc049dbcb92d'
  GHC_WASM_FLAVOUR: '9.14'
  NODE_VERSION: '24'

jobs:
  page:
    runs-on: ubuntu-latest
    # Releases are made and their assets added and deleted with the run's
    # own token.
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Pin the cabal directory
      run: echo "CABAL_DIR=$HOME/.cabal" >> "$GITHUB_ENV"

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm

    # The same caches as build.yml's wasm job, read and written under the
    # same keys.
    - name: Cache wasm sysroot
      uses: actions/cache@v5
      with:
        path: ~/.ghc-wasm
        key: ${{ runner.os }}-ghc-wasm-sysroot-${{ env.GHC_WASM_META_REV }}

    - name: Cache wasm cross-compiler
      uses: actions/cache@v5
      with:
        path: /usr/local/.ghcup/ghc/wasm32-wasi-${{ env.WASM_GHC_VERSION }}
        key: ${{ runner.os }}-ghcup-wasm32-wasi-${{ env.WASM_GHC_VERSION }}

    # As in build.yml's wasm job on a hosted runner.
    - name: Install GHC WebAssembly toolchain
      run: |
        mkdir -p "$RUNNER_TEMP/ghc-wasm-meta"
        curl --fail --location --retry 5 "https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta/-/archive/$GHC_WASM_META_REV/ghc-wasm-meta-$GHC_WASM_META_REV.tar.gz" | tar xz --strip-components=1 --directory "$RUNNER_TEMP/ghc-wasm-meta"
        if [ ! -x "$HOME/.ghc-wasm/add_to_github_path.sh" ]; then
          SKIP_GHC=1 FLAVOUR="$GHC_WASM_FLAVOUR" "$RUNNER_TEMP/ghc-wasm-meta/setup.sh"
        fi
        touch "$HOME/.ghc-wasm/.bootstrap-$GHC_WASM_META_REV"
        # shellcheck source=/dev/null
        . ~/.ghc-wasm/env
        if ! ghcup whereis cabal "$CABAL_VERSION" >/dev/null 2>&1; then
          ghcup install cabal "$CABAL_VERSION"
        fi
        ghcup set cabal "$CABAL_VERSION"
        if ! ghcup whereis ghc "wasm32-wasi-$WASM_GHC_VERSION" >/dev/null 2>&1; then
          # CONFIGURE_ARGS is a list of arguments, split on purpose.
          # shellcheck disable=SC2086
          ghcup -s "file://$RUNNER_TEMP/ghc-wasm-meta/ghcup-wasm-0.0.9.yaml" install ghc "wasm32-wasi-$WASM_GHC_VERSION" --set -- $CONFIGURE_ARGS
        fi
        ghcup set ghc "wasm32-wasi-$WASM_GHC_VERSION"

    # The prerender, wiki-app-prerender, is a native program.
    - name: Install host GHC
      run: |
        if ! ghcup whereis ghc "$GHC_VERSION" >/dev/null 2>&1; then
          ghcup install ghc "$GHC_VERSION"
        fi
        ghcup set ghc "$GHC_VERSION"

    - name: Activate toolchain
      run: |
        echo "$(ghcup whereis basedir)/ghc/wasm32-wasi-$WASM_GHC_VERSION/bin" >> "$GITHUB_PATH"
        echo "$(ghcup whereis basedir)/bin" >> "$GITHUB_PATH"

    - name: Install libpq
      run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libpq-dev

    # As in build.yml's jobs, under the same cache key. libsodium, which
    # every native build links statically:
    # toolchain/libsodium.sh builds the release toolchain/pins.env pins into
    # ~/.wiki-toolchain (under a minute), and the cache keeps the built
    # library, keyed by the pinned version and checksum and by the script
    # that builds it. Its env mode gives the later steps PKG_CONFIG_PATH,
    # LIBRARY_PATH and C_INCLUDE_PATH, through which cabal finds it.
    - name: Read the libsodium pin
      id: libsodium
      run: |
        . toolchain/pins.env
        echo "version=$LIBSODIUM_VERSION" >> "$GITHUB_OUTPUT"
        echo "sha256=$LIBSODIUM_SHA256" >> "$GITHUB_OUTPUT"

    - name: Cache libsodium
      uses: actions/cache@v5
      with:
        path: ~/.wiki-toolchain/libsodium-${{ steps.libsodium.outputs.version }}
        key: ${{ runner.os }}-libsodium-${{ steps.libsodium.outputs.version }}-${{ steps.libsodium.outputs.sha256 }}-${{ hashFiles('toolchain/libsodium.sh') }}

    - name: Build libsodium
      run: |
        sh toolchain/libsodium.sh install
        sh toolchain/libsodium.sh env >> "$GITHUB_ENV"

    - name: Install JavaScript dependencies
      run: npm ci

    - name: Update Cabal package index
      run: cabal update

    # This build's own store (decision 54 of docs/PLAN.md): its -O2
    # dependencies have unit ids of their own, so build.yml's wasm store,
    # at the everyday optimisation, does not hold them, and a run that
    # restored only that one compiled every -O2 dependency again (an hour).
    # One cache entry per cabal version, written by this job only, carried
    # forward from run to run as build.yml's are: the newest copy of this
    # ref (or of main), or, the first time, build.yml's wasm store, which
    # holds the prerender's native dependencies and the everyday wasm ones.
    # The key ends in the run's id, since a key cannot be overwritten; the
    # job prune-caches deletes the older copies once this job has ended. It
    # runs on main and on tags, not on pull requests. The last restore key
    # takes build.yml's copies saved under the key that named the
    # compilers' versions, once: remove it with build.yml's.
    - name: Restore cached dependencies
      uses: actions/cache/restore@v5
      id: cache
      env:
        key: ${{ runner.os }}-wasm-opt-store-cabal-${{ env.CABAL_VERSION }}-${{ runner.environment }}-v1
      with:
        path: ${{ env.CABAL_DIR }}/store
        key: ${{ env.key }}-${{ github.run_id }}
        restore-keys: |
          ${{ env.key }}-
          ${{ runner.os }}-wasm-store-cabal-${{ env.CABAL_VERSION }}-${{ runner.environment }}-v1-
          ${{ runner.os }}-wasm-${{ env.WASM_GHC_VERSION }}-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}-

    - name: Cache the build directories
      uses: actions/cache@v5
      env:
        compatibility: ${{ runner.os }}-${{ runner.arch }}-server-page-build-v1-ghc-${{ env.GHC_VERSION }}-wasm-${{ env.WASM_GHC_VERSION }}
      with:
        path: |
          dist-newstyle/native-fast
          dist-newstyle/wasm-opt/build
          dist-newstyle/wasm-opt/cache
          dist-newstyle/wasm-opt/packagedb
          dist-newstyle/wasm-opt/src
        key: ${{ env.compatibility }}-cabal-${{ env.CABAL_VERSION }}-${{ hashFiles('cabal*.project*', 'wiki-*/**', 'web/src/katex-macros.tex') }}
        restore-keys: ${{ env.compatibility }}-

    # The maker's among them (`npm run` builds and runs the maker).
    - name: Install dependencies
      run: |
        cabal build all --only-dependencies --project-file=cabal-native-fast.project --builddir=dist-newstyle/native-fast
        (cd maker && cabal build exe:maker --only-dependencies)
        (
          # shellcheck source=/dev/null
          . ~/.ghc-wasm/env
          rm -f dist-newstyle/wasm-opt/cache/compiler
          cabal build all --only-dependencies --project-file=cabal-wasm-opt.project \
            --builddir=dist-newstyle/wasm-opt \
            --with-compiler="$(command -v wasm32-wasi-ghc)" \
            --with-hc-pkg="$(command -v wasm32-wasi-ghc-pkg)" \
            --with-hsc2hs="$(command -v wasm32-wasi-hsc2hs)"
        )

    # Once the dependencies have built, before the page: a failure in the
    # wiki's own code still keeps them.
    - name: Save cached dependencies
      uses: actions/cache/save@v5
      with:
        path: ${{ env.CABAL_DIR }}/store
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Build the server's page
      env:
        WIKI_BACKEND: server
        HALOGEN_BASE_PATH: /
      run: npm run build-wasm-opt

    # Into a directory of its own, so that the server's page stays.
    - name: Build the demo's page
      env:
        WIKI_BACKEND: demo
        HALOGEN_BASE_PATH: /
        WIKI_PUBLIC_DIR: dist-newstyle/wasm-opt/public/demo
      run: npm run build-wasm-opt

    # Each directory's contents at its zip's root, as the deploy script
    # unpacks it; it checks for the same three files.
    - name: Zip the pages
      id: zip
      run: |
        if [ "$GITHUB_REF_TYPE" = tag ]; then
          name=$(printf '%s' "$GITHUB_REF_NAME" | tr / -)
        else
          name=$GITHUB_SHA
        fi
        for kind in server demo; do
          if [ "$kind" = server ]; then
            app=dist-newstyle/wasm-opt/public/app
          else
            app=dist-newstyle/wasm-opt/public/demo
          fi
          for file in index.html 404.html app.wasm; do
            [ -f "$app/$file" ] || { echo "::error::the $kind's page lacks $file"; exit 1; }
          done
          asset="app-$kind-$name.zip"
          (cd "$app" && zip -q -r -X "$RUNNER_TEMP/$asset" .)
          echo "$kind=$asset" >> "$GITHUB_OUTPUT"
          du -h "$RUNNER_TEMP/$asset" | tee -a "$GITHUB_STEP_SUMMARY"
        done

    - name: Keep the pages of main on the pre-release main-latest
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        SERVER_ASSET: ${{ steps.zip.outputs.server }}
        DEMO_ASSET: ${{ steps.zip.outputs.demo }}
      run: |
        if ! gh release view main-latest >/dev/null 2>&1; then
          gh release create main-latest --prerelease --target "$GITHUB_SHA" \
            --title 'The pages of main, latest five commits' \
            --notes 'The page wiki-server serves and the demo, for the newest commits of main.'
        fi
        gh release upload main-latest "$RUNNER_TEMP/$SERVER_ASSET" "$RUNNER_TEMP/$DEMO_ASSET" --clobber
        # The pages of the newest five commits are kept, a commit's two
        # together. The assets, newest first by the time each was uploaded;
        # then the commits, each once, in the order of its newest asset. A
        # commit built before the demo's page was added has only its
        # server's page, and counts the same.
        gh api "repos/$GITHUB_REPOSITORY/releases/tags/main-latest" \
          --jq '.assets[] | select(.name | test("^app-(server|demo)-[0-9a-f]{40}[.]zip$")) | "\(.updated_at) \(.name)"' |
          sort -r > "$RUNNER_TEMP/assets"
        sed -E 's/^[^ ]+ app-(server|demo)-([0-9a-f]{40})[.]zip$/\2/' "$RUNNER_TEMP/assets" | awk '!seen[$0]++' > "$RUNNER_TEMP/commits"
        tail -n +6 "$RUNNER_TEMP/commits" | while read -r commit; do
          for name in "app-server-$commit.zip" "app-demo-$commit.zip"; do
            if grep -q " $name\$" "$RUNNER_TEMP/assets"; then
              echo "deleting $name"
              gh release delete-asset main-latest "$name" --yes
            fi
          done
        done
        # shellcheck disable=SC2016 # Markdown's backticks, not commands.
        {
          echo 'The pages of the newest five commits of main that have them, newest first. For each commit, `app-server-<hash>.zip` is the page wiki-server serves, and `app-demo-<hash>.zip` the serverless demo (a prerendered page per route, the wiki kept in the browser).'
          echo
          head -n 5 "$RUNNER_TEMP/commits" | while read -r commit; do
            time=$(grep -m 1 -E " app-(server|demo)-${commit}[.]zip\$" "$RUNNER_TEMP/assets" | cut -d' ' -f1)
            echo "- $commit, built $time:"
            if grep -q " app-server-${commit}[.]zip\$" "$RUNNER_TEMP/assets"; then
              printf '  - the server'"'"'s page, `app-server-%s.zip`: `sh toolchain/deploy-local.sh --backend-only=%s`\n' "$commit" "$commit"
            fi
            if grep -q " app-demo-${commit}[.]zip\$" "$RUNNER_TEMP/assets"; then
              printf '  - the demo, `app-demo-%s.zip`: `sh toolchain/deploy-local.sh --static --backend-only=%s`\n' "$commit" "$commit"
            fi
          done
          echo
          echo 'The newest: `--backend-only=main` for the server, `--static --backend-only=main` for the demo.'
        } > "$RUNNER_TEMP/notes"
        gh release edit main-latest --notes-file "$RUNNER_TEMP/notes"

    - name: Keep the pages of the tag on its release
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        SERVER_ASSET: ${{ steps.zip.outputs.server }}
        DEMO_ASSET: ${{ steps.zip.outputs.demo }}
      run: |
        if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Two pages are attached. $SERVER_ASSET is the page wiki-server serves: sh toolchain/deploy-local.sh --backend-only=$GITHUB_REF_NAME deploys it with the server. $DEMO_ASSET is the serverless demo: sh toolchain/deploy-local.sh --static --backend-only=$GITHUB_REF_NAME deploys it."
        fi
        gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$SERVER_ASSET" "$RUNNER_TEMP/$DEMO_ASSET" --clobber

  # The older copies of the store the page job saved, deleted once that job
  # has ended, as build.yml's prune-caches does for its caches: never beside
  # a job that may still be restoring one.
  prune-caches:
    name: prune older cache copies
    needs: page
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Prune the -O2 wasm store
      env:
        GH_TOKEN: ${{ github.token }}
        PREFIX: ${{ runner.os }}-wasm-opt-store-cabal-${{ env.CABAL_VERSION }}-github-hosted-v1-
      run: sh toolchain/ci-prune-caches.sh "$PREFIX" "${PREFIX}${{ github.run_id }}"
